repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: ^scripts/.*\.sh$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.28.0
    hooks:
      - id: check-jsonschema
        name: validate workflows/cluster.yaml
        files: ^workflows/cluster\.yaml$
        args: ["--schemafile", "workflows/cluster.schema.json"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - asyncssh>=2.14
          - click>=8.1
          - pyyaml>=6.0
          - rich>=13.7
          - types-PyYAML
        files: ^src/svggt_orch/.*\.py$
