[project]
name = "streamvggt"
version = "0.1.0"
description = "Streaming 4D Visual Geometry Transformer"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Dong Zhuo" },
    { name = "Wenzhao Zheng" },
    { name = "Jiahe Guo" },
    { name = "Yuqi Wu" },
    { name = "Jie Zhou" },
    { name = "Jiwen Lu" },
]
dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "numpy==1.26.1",
    "Pillow==10.3.0",
    "huggingface-hub",
    "safetensors",
    "roma",
    "matplotlib",
    "tqdm",
    "opencv-python",
    "scipy",
    "einops",
    "trimesh",
    "tensorboard",
    "pyglet<2",
    "viser==0.2.23",
    "lpips",
    "hydra-core",
    "h5py",
    "accelerate",
    "transformers",
    "scikit-learn",
    "gsplat",
    "evo",
    "open3d",
    "gradio",
]

[project.optional-dependencies]
demo = [
    "omegaconf",
    "onnxruntime",
    "requests",
    "pydantic==2.10.6",
    "gradio-client",
]
pose-eval = [
    "pycolmap==3.10.0",
    "pyceres==2.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
