ssh:
  user: jing.feng
  # Pick at least one of identity_file / password. asyncssh tries the key
  # first, then falls back to the password. Both work for IPs and hostnames.
  #
  #   identity_file: ~/.ssh/id_ed25519         # SSH key (preferred for prod)
  #   password: "my-plaintext-password"        # literal — TRIGGERS a WARN at load
  #   password: "${SSH_PASSWORD}"              # env-var interpolation (recommended)
  #
  password: "${SSH_PASSWORD}"
  connect_timeout_s: 5

# Pool of candidate hosts to scan during `discover`.
# Edit to match your fleet; unreachable hosts are skipped gracefully.
candidate_hosts:
  - 172.31.208.3
  - 172.31.208.4
  - 172.31.208.6
  - 172.31.208.7

docker:
  image: babiking/ubuntu:12.8.1-cudnn-devel-ubuntu24.04
  shm_size: 16G

paths:
  repo: /jfs/jing.feng/codebases/StreamVGGT
  venv: /jfs/jing.feng/codebases/StreamVGGT/.venv
  jfs: /jfs

discovery:
  idle_threshold_mib: 500       # a GPU counts as idle if memory.used < this
  min_idle_gpus_per_node: 1     # skip nodes with fewer idle GPUs

nccl:
  ib_hca: mlx5_1                # mlx5_0 is currently DOWN
  socket_ifname: bond0
  ib_disable: 0
  async_error_handling: 1
  debug: WARN                   # INFO during bring-up, then WARN
  ib_timeout: 23
  net_gdr_level: PIX

train:
  entrypoint: src/train.py
  config_name: train_smoke    # was: train (full distillation). Swap back when smoke passes.
  main_port: 26902
